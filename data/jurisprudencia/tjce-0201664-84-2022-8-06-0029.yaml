titulo: Perícia grafotécnica comprova falsificação em cartão consignado
resumo_predator: A nulidade foi mantida após perícia grafotécnica comprovar
  falsificação da assinatura, com restituição dos descontos e dano moral fixado
  em quinhentos reais.
