questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a assinatura ou a perícia demonstram autoria e adesão válida ao negócio
  impugnado; se a instituição comprovou a existência e a autoria do contrato que
  originou os descontos; se os descontos e as circunstâncias da contratação
  configuram dano moral indenizável.
