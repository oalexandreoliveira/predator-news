  data_publicacao: 2025-04-30
titulo: RMC convertida em empréstimo consignado
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a instituição comprovou a existência e a autoria do
  contrato que originou os descontos; se a sistemática de desconto mínimo e
  encargos torna a dívida excessivamente onerosa ou de duração indefinida; se a
  operação deve ser preservada como cartão consignado ou convertida em
  empréstimo consignado comum; se os descontos indevidos devem ser restituídos
  e, em caso positivo, de forma simples ou em dobro; se os descontos e as
  circunstâncias da contratação configuram dano moral indenizável; se saques,
  compras ou faturas reiteradas demonstram ciência e aceitação da modalidade
  contratada, no contexto de recurso parcialmente provido.
ratio_decidendi: O uso do cartão em saques ou compras foi avaliado em conjunto
  com o dever de informação e a documentação contratual, levando o colegiado a
  determinar a conversão da operação.
resumo_predator: O Turma Recursal Cível e Criminal de Bacabal examinou a
  contratação de cartão de crédito consignado e determinou a conversão da
  operação, considerando determinante o uso do cartão em saques ou compras. No
  plano processual, houve recurso parcialmente provido.
