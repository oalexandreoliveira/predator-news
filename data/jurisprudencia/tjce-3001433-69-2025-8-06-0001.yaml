titulo: Validade do cartão consignado reconhecida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a sistemática de desconto mínimo e encargos torna a
  dívida excessivamente onerosa ou de duração indefinida; se a operação deve ser
  preservada como cartão consignado ou convertida em empréstimo consignado
  comum; se os descontos indevidos devem ser restituídos e, em caso positivo, de
  forma simples ou em dobro; se saques, compras ou faturas reiteradas demonstram
  ciência e aceitação da modalidade contratada, no contexto de recurso provido.
ratio_decidendi: O uso do cartão em saques ou compras foi avaliado em conjunto
  com o dever de informação e a documentação contratual, levando o colegiado a
  preservar a validade da contratação.
resumo_predator: A 1ª Turma do Núcleo de Justiça 4.0 - Direito Privado examinou
  a contratação de cartão de crédito consignado e preservou a validade da
  contratação, considerando determinante o uso do cartão em saques ou compras.
  No plano processual, houve recurso provido.
