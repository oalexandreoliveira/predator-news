titulo: TCE digital sustenta reforma e improcedência
questao_juridica: Contrato digital e TCE assinado comprovam consentimento informado e autorizam reformar sentença que reconhecera vício na contratação da RMC?
ratio_decidendi: O contrato digital e o TCE demonstraram ciência suficiente da modalidade, afastando vício e ato ilícito e conduzindo à reforma da sentença, sem repetição nem dano moral.
resumo_predator: 4ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso conhecido e provido.
