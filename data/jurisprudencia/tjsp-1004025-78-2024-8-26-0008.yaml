titulo: "Inexistência da contratação consignada: documentação digital sem cadeia segura"
questao_juridica: Documentos eletrônicos unilaterais demonstram vínculo seguro ou apenas aparência formal insuficiente?
ratio_decidendi: O colegiado valorou documentação digital sem cadeia segura e, com base nesse conjunto individualizado, concluiu por inexistência; restituição simples; moral de R$ 5 mil.
resumo_predator: "19ª Câmara, sob relatoria de João Camillo de Almeida Prado Costa, julgou recurso bancário desprovido. No plano material, decidiu: inexistência; restituição simples; moral de R$ 5 mil. A prova determinante foi documentação digital sem cadeia segura."
