titulo: Saque autorizado não caracteriza venda casada
questao_juridica: A contratação eletrônica clara e o saque autorizado pela disciplina da RMC afastam venda casada e nulidade, ainda que não haja compras típicas do cartão?
ratio_decidendi: O instrumento digital e o TCE demonstraram ciência da modalidade, enquanto o saque foi reconhecido como uso legalmente permitido, sem exigência de compras adicionais e sem venda casada.
resumo_predator: 2ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso conhecido e desprovido.
