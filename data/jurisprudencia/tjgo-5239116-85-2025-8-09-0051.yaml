titulo: "Conversão do cartão consignado: assinatura, biometria, geolocalização e TED"
questao_juridica: contratação digital válida pode ser convertida sem gerar cobrança indevida?
ratio_decidendi: O colegiado valorou assinatura, biometria, geolocalização e TED e, com base nesse conjunto individualizado, concluiu por contratação válida; conversão mantida; dobro e dano afastados.
resumo_predator: "2ª Câmara, sob relatoria de VICENTE LOPES DA ROCHA JÚNIOR, julgou agravo interno desprovido. No plano material, decidiu: contratação válida; conversão mantida; dobro e dano afastados. A prova determinante foi assinatura, biometria, geolocalização e TED."
