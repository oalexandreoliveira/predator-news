titulo: "Validade da contratação consignada: assinatura, biometria, IP, termo e saque"
questao_juridica: Trilha digital e aproveitamento do saque justificam reformar sentença que havia convertido o produto?
ratio_decidendi: O colegiado valorou assinatura, biometria, IP, termo e saque e, com base nesse conjunto individualizado, concluiu por validade restaurada; conversão e moral afastados.
resumo_predator: "20ª Câmara, sob relatoria de Maria Salete Corrêa Dias, julgou recurso bancário provido. No plano material, decidiu: validade restaurada; conversão e moral afastados. A prova determinante foi assinatura, biometria, IP, termo e saque."
