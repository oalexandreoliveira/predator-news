titulo: Prova digital, TCE e saque preservam contratos RMC/RCC
questao_juridica: Biometria, termo de consentimento e saque demonstrado superam sentença de nulidade parcial e comprovam contratação informada de RMC e RCC?
ratio_decidendi: O conjunto formado por biometria, TCE e saque vinculou autoria, ciência da modalidade e comportamento posterior, justificando a reforma da sentença e a manutenção dos contratos.
resumo_predator: TERCEIRA TURMA RECURSAL examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso conhecido e provido.
