titulo: "Invalidade da contratação consignada: ausência de uso e informação; descontos"
questao_juridica: Como a prova-chave (ausência de uso e informação; descontos) sustenta os resultados materiais (invalidade; dobro; moral) efetivamente decididos?
ratio_decidendi: O colegiado valorou ausência de uso e informação; descontos e, com base nesse conjunto individualizado, concluiu por invalidade; dobro; moral.
resumo_predator: "1ª Turma Justiça Eficiente, 3º Gab., sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso do consumidor provido. No plano material, decidiu: invalidade; dobro; moral. A prova determinante foi ausência de uso e informação; descontos."
