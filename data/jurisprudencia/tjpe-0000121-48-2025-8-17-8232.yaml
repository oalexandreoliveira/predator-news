titulo: "Invalidade da contratação consignada: descontos sucessivos e falha informacional"
questao_juridica: Como a prova-chave (descontos sucessivos e falha informacional) sustenta os resultados materiais (prescrição rejeitada; dobro; moral afastado) efetivamente decididos?
ratio_decidendi: O colegiado valorou descontos sucessivos e falha informacional e, com base nesse conjunto individualizado, concluiu por prescrição rejeitada; dobro; moral afastado.
resumo_predator: "2ª Turma Justiça Eficiente, 2º Gab., sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou sentença mantida. No plano material, decidiu: prescrição rejeitada; dobro; moral afastado. A prova determinante foi descontos sucessivos e falha informacional."
