titulo: "Validade da contratação consignada: termo assinado e saques complementares"
questao_juridica: uso habitual por saques basta ao distinguishing da Súmula 63?
ratio_decidendi: O colegiado valorou termo assinado e saques complementares e, com base nesse conjunto individualizado, concluiu por RMC mantida; conversão, repetição e dano afastados.
resumo_predator: "6ª Câmara, sob relatoria de PERICLES DI MONTEZUMA CASTRO MOURA, julgou recurso do banco provido; do consumidor prejudicado. No plano material, decidiu: RMC mantida; conversão, repetição e dano afastados. A prova determinante foi termo assinado e saques complementares."
