titulo: Validade do cartão consignado reconhecida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se os elementos da contratação eletrônica são suficientes
  para demonstrar autoria, integridade e consentimento; se a sistemática de
  desconto mínimo e encargos torna a dívida excessivamente onerosa ou de duração
  indefinida; se a operação deve ser preservada como cartão consignado ou
  convertida em empréstimo consignado comum; se os descontos indevidos devem ser
  restituídos e, em caso positivo, de forma simples ou em dobro, no contexto de
  recurso desprovido.
ratio_decidendi: O conjunto de autenticação e documentos eletrônicos foi
  avaliado em conjunto com o dever de informação e a documentação contratual,
  levando o colegiado a preservar a validade da contratação.
resumo_predator: A 3ª TURMA CÍVEL examinou a contratação de cartão de crédito
  consignado e preservou a validade da contratação, considerando determinante o
  conjunto de autenticação e documentos eletrônicos. No plano processual, houve
  recurso desprovido.
