titulo: "Contratação de cartão consignado invalidada"
questao_juridica: "Validade e efeitos da contratação de cartão de crédito consignado diante da alegação de vício de consentimento, falha informativa ou abusividade."
ratio_decidendi: "A clareza do instrumento e do consentimento documentado foi avaliado em conjunto com o dever de informação e a documentação contratual, levando o colegiado a invalidar a contratação ou a modalidade impugnada."
resumo_predator: "A 3ª Câmara de Direito Comercial examinou a contratação de cartão de crédito consignado e invalidou a contratação ou a modalidade impugnada, considerando determinante a clareza do instrumento e do consentimento documentado. O resultado processual foi preservado conforme o documento recuperado."
