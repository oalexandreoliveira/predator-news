titulo: "Conversão do cartão consignado: poucas compras, saque predominante e informação insuficiente"
questao_juridica: Como a prova-chave (poucas compras, saque predominante e informação insuficiente) sustenta os resultados materiais (conversão; dobro do excesso; moral afastado) efetivamente decididos?
ratio_decidendi: O colegiado valorou poucas compras, saque predominante e informação insuficiente e, com base nesse conjunto individualizado, concluiu por conversão; dobro do excesso; moral afastado.
resumo_predator: "4ª Câmara Cível, sob relatoria de ELIO BRAZ MENDES, julgou apelação parcialmente provida. No plano material, decidiu: conversão; dobro do excesso; moral afastado. A prova determinante foi poucas compras, saque predominante e informação insuficiente."
