titulo: "Conversão do cartão consignado: contrato existente, crédito e informação econômica insuficiente"
questao_juridica: Autoria formal impede conversão quando não se prova compreensão da amortização e do custo do produto?
ratio_decidendi: O colegiado valorou contrato existente, crédito e informação econômica insuficiente e, com base nesse conjunto individualizado, concluiu por conversão; compensação; restituição; moral afastado.
resumo_predator: "Núcleo 4.0-T. VII, sob relatoria de Gustavo Santini Teodoro, julgou apelação parcialmente provida. No plano material, decidiu: conversão; compensação; restituição; moral afastado. A prova determinante foi contrato existente, crédito e informação econômica insuficiente."
