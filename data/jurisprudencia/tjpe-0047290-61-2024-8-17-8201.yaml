titulo: "Inexistência da contratação consignada: contratação remota sem trilha informacional suficiente"
questao_juridica: Como a prova-chave (contratação remota sem trilha informacional suficiente) sustenta os resultados materiais (inexistência/invalidade; dobro) efetivamente decididos?
ratio_decidendi: O colegiado valorou contratação remota sem trilha informacional suficiente e, com base nesse conjunto individualizado, concluiu por inexistência/invalidade; dobro; atualização não cumulativa.
resumo_predator: "2ª Turma Justiça Eficiente, 3º Gab., sob relatoria de PATRICK DE MELO GARIOLLI, julgou pretensão invalidante acolhida. No plano material, decidiu: inexistência/invalidade; dobro; atualização não cumulativa. A prova determinante foi contratação remota sem trilha informacional suficiente."
