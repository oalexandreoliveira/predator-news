  data_publicacao: 2023-08-28
titulo: Validade do cartão consignado reconhecida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a assinatura ou a perícia demonstram autoria e adesão
  válida ao negócio impugnado; se a operação deve ser preservada como cartão
  consignado ou convertida em empréstimo consignado comum; se o crédito recebido
  ou o saque realizado comprova a contratação e qual modalidade econômica foi
  efetivamente pactuada, no contexto de recurso desprovido.
ratio_decidendi: A clareza do instrumento e do consentimento documentado foi
  avaliado em conjunto com o dever de informação e a documentação contratual,
  levando o colegiado a preservar a validade da contratação.
resumo_predator: O Turma Recursal Cível e Criminal de Chapadinha examinou a
  contratação de cartão de crédito consignado e preservou a validade da
  contratação, considerando determinante a clareza do instrumento e do
  consentimento documentado. No plano processual, houve recurso desprovido.
