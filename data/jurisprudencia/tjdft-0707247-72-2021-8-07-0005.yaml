titulo: "Validade formal e integração contratual por abusividade"
questao_juridica: "Validade e efeitos da contratação de cartão de crédito consignado diante da alegação de vício de consentimento, falha informativa ou abusividade."
ratio_decidendi: "O conjunto de autenticação e documentos eletrônicos foi avaliado em conjunto com o dever de informação e a documentação contratual, levando o colegiado a integrou o contrato sem negar sua validade formal."
resumo_predator: "O TERCEIRA TURMA RECURSAL examinou a contratação de cartão de crédito consignado e integrou o contrato sem negar sua validade formal, considerando determinante o conjunto de autenticação e documentos eletrônicos. No plano processual, houve recurso desprovido."
