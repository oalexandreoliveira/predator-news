questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição comprovou a existência e a autoria do contrato que originou os
  descontos; se os descontos indevidos devem ser restituídos e, em caso
  positivo, de forma simples ou em dobro.
