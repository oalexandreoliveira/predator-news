  data_publicacao: 2024-12-13
titulo: Validade do cartão consignado reconhecida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se os elementos da contratação eletrônica são suficientes
  para demonstrar autoria, integridade e consentimento; se a assinatura ou a
  perícia demonstram autoria e adesão válida ao negócio impugnado; se a operação
  deve ser preservada como cartão consignado ou convertida em empréstimo
  consignado comum; se os descontos indevidos devem ser restituídos e, em caso
  positivo, de forma simples ou em dobro; se os descontos e as circunstâncias da
  contratação configuram dano moral indenizável; se saques, compras ou faturas
  reiteradas demonstram ciência e aceitação da modalidade contratada.
ratio_decidendi: O uso do cartão em saques ou compras foi avaliado em conjunto
  com o dever de informação e a documentação contratual, levando o colegiado a
  preservar a validade da contratação.
resumo_predator: A 8ª TURMA CÍVEL examinou a contratação de cartão de crédito
  consignado e preservou a validade da contratação, considerando determinante o
  uso do cartão em saques ou compras. O resultado processual foi preservado
  conforme o documento recuperado.
