titulo: Selfie, IP e TCE confirmam contratação digital
questao_juridica: Selfie, documento, endereço IP compatível e termo de consentimento esclarecido demonstram autoria e consentimento informado para manter a RMC?
ratio_decidendi: A convergência entre instrumento assinado digitalmente, selfie, documento, IP situado na cidade do consumidor e TCE demonstrou contratação informada, afastando vício, ilícito, repetição e dano moral.
resumo_predator: 5ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso do banco provido; recurso do consumidor prejudicado.
