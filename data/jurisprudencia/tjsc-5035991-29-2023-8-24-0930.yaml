titulo: Biometria e protocolo de aceite comprovam adesão
questao_juridica: Fotografia biométrica, documento e protocolo de aceite são suficientes, em conjunto, para comprovar autoria e ciência da modalidade RMC?
ratio_decidendi: A assinatura eletrônica apoiada por fotografia biométrica, documento pessoal e protocolo de aceite comprovou autoria e conhecimento do produto, inexistindo falha informativa ou ato ilícito indenizável.
resumo_predator: 2ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso conhecido e desprovido.
