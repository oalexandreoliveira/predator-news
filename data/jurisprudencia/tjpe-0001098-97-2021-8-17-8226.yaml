titulo: "Validade da contratação consignada: termo, transferências, saques e compras"
questao_juridica: Como a prova-chave (termo, transferências, saques e compras) sustenta os resultados materiais (contrato mantido) efetivamente decididos?
ratio_decidendi: O colegiado valorou termo, transferências, saques e compras e, com base nesse conjunto individualizado, concluiu por contrato mantido.
resumo_predator: "1ª Turma Recursal de Petrolina, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso desprovido. No plano material, decidiu: contrato mantido. A prova determinante foi termo, transferências, saques e compras."
