titulo: "Validade da contratação consignada: biometria, termo, saque inicial e compras"
questao_juridica: Saque seguido de compras ratifica o produto e torna a amortização lenta consequência da modalidade?
ratio_decidendi: O colegiado valorou biometria, termo, saque inicial e compras e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão e moral afastados.
resumo_predator: "Núcleo 4.0-T. VII, sob relatoria de Gustavo Santini Teodoro, julgou apelação desprovida. No plano material, decidiu: contrato mantido; conversão e moral afastados. A prova determinante foi biometria, termo, saque inicial e compras."
