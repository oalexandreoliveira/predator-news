titulo: "Conversão do cartão consignado: pagamento mínimo indefinido e crédito sujeito a comprovação"
questao_juridica: Como a prova-chave (pagamento mínimo indefinido e crédito sujeito a comprovação) sustenta os resultados materiais (readequação; dobro; compensação; moral de R$ 10 mil) efetivamente decididos?
ratio_decidendi: O colegiado valorou pagamento mínimo indefinido e crédito sujeito a comprovação e, com base nesse conjunto individualizado, concluiu por readequação; dobro; compensação; moral de R$ 10 mil.
resumo_predator: "Núcleo 4.0/5ª Câmara Cível, sob relatoria de JOSE JUNIOR FLORENTINO DOS SANTOS MENDONCA, julgou apelação provida. No plano material, decidiu: readequação; dobro; compensação; moral de R$ 10 mil. A prova determinante foi pagamento mínimo indefinido e crédito sujeito a comprovação."
