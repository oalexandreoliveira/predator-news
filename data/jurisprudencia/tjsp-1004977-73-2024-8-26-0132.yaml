titulo: "Validade da contratação consignada: assinatura eletrônica, documentos e depósito"
questao_juridica: Ausência de ICP-Brasil compromete assinatura eletrônica confirmada por autoria, integridade e crédito?
ratio_decidendi: O colegiado valorou assinatura eletrônica, documentos e depósito e, com base nesse conjunto individualizado, concluiu por contrato mantido; perícia, restituição e moral afastados.
resumo_predator: "15ª Câmara, sob relatoria de Rodolfo Pellizari, julgou apelação desprovida. No plano material, decidiu: contrato mantido; perícia, restituição e moral afastados. A prova determinante foi assinatura eletrônica, documentos e depósito."
