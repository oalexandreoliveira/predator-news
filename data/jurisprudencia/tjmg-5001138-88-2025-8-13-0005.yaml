questao_juridica: crédito em conta integra prova de contratação contestada?
ratio_decidendi: O colegiado valorou biometria; depósito em conta e, com base nesse conjunto individualizado, concluiu por existência reconhecida; dobro e dano afastados.
resumo_predator: "8º Núcleo 4.0, sob relatoria de Sérgio Henrique Cordeiro Caldas Fernandes (JD2G), julgou apelação desprovida. No plano material, decidiu: existência reconhecida; dobro e dano afastados. A prova determinante foi biometria; depósito em conta."
