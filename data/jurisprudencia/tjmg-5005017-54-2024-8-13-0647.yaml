titulo: "Conversão do cartão consignado: perícia confirmou face, mas faltou original digital"
questao_juridica: biometria facial comprova assinatura eletrônica não auditável?
ratio_decidendi: O colegiado valorou perícia confirmou face, mas faltou original digital e, com base nesse conjunto individualizado, concluiu por conversão; dobro; dano moral.
resumo_predator: "12ª Câmara, sob relatoria de Régia Ferreira de Lima, julgou apelação provida. No plano material, decidiu: conversão; dobro; dano moral. A prova determinante foi perícia confirmou face, mas faltou original digital."
