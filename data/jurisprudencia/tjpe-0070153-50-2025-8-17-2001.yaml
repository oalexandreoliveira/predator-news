titulo: "Validade da contratação consignada: assinatura eletrônica, biometria, IP, selfie, faturas pagas e crédito"
questao_juridica: Como a prova-chave (assinatura eletrônica, biometria, IP, selfie, faturas pagas e crédito) sustenta os resultados materiais (contrato mantido; pedidos improcedentes) efetivamente decididos?
ratio_decidendi: O colegiado valorou assinatura eletrônica, biometria, IP, selfie, faturas pagas e crédito e, com base nesse conjunto individualizado, concluiu por contrato mantido; pedidos rejeitados.
resumo_predator: "Núcleo 4.0 de 2º grau, 2ª Turma/1º Gab., sob relatoria de CANDIDO JOSE DA FONTE SARAIVA DE MORAES, julgou recurso bancário provido. No plano material, decidiu: contrato mantido; pedidos rejeitados. A prova determinante foi assinatura eletrônica, biometria, IP, selfie, faturas pagas e crédito."
