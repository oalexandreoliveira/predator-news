titulo: "Validade da contratação consignada: termo assinado, saque, faturas e uso"
questao_juridica: Como a prova-chave (termo assinado, saque, faturas e uso) sustenta os resultados materiais (contrato mantido; conversão rejeitada) efetivamente decididos?
ratio_decidendi: O colegiado valorou termo assinado, saque, faturas e uso e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão e danos rejeitados.
resumo_predator: "2ª Câmara Cível, sob relatoria de RUY TREZENA PATU JÚNIOR, julgou recurso bancário provido. No plano material, decidiu: contrato mantido; conversão e danos rejeitados. A prova determinante foi termo assinado, saque, faturas e uso."
