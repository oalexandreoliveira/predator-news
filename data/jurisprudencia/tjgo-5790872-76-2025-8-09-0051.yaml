titulo: "Conversão do cartão consignado: biometria e crédito, sem compras"
questao_juridica: contratação digital válida impede conversão quando não houve uso típico?
ratio_decidendi: O colegiado valorou biometria e crédito, sem compras e, com base nesse conjunto individualizado, concluiu por contratação reconhecida; conversão; restituição ajustada; dano readequado.
resumo_predator: "8ª Câmara, sob relatoria de JOSÉ RICARDO M. MACHADO, julgou apelação parcialmente provida. No plano material, decidiu: contratação reconhecida; conversão; restituição ajustada; dano readequado. A prova determinante foi biometria e crédito, sem compras."
