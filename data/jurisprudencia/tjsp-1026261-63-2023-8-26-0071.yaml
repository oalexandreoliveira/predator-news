titulo: "Validade da contratação consignada: contrato claro, crédito e uso reiterado"
questao_juridica: Direito de cancelar libera a margem antes da quitação e o uso reiterado afasta erro substancial?
ratio_decidendi: O colegiado valorou contrato claro, crédito e uso reiterado e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, restituição e moral afastados; cancelamento facultado.
resumo_predator: "38ª Câmara, sob relatoria de Flavia Beatriz Goncalez da Silva, julgou apelação desprovida. No plano material, decidiu: contrato mantido; conversão, restituição e moral afastados; cancelamento facultado. A prova determinante foi contrato claro, crédito e uso reiterado."
