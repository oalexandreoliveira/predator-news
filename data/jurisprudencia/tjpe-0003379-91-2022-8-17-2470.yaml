titulo: "Conversão do cartão consignado: descontos prolongados e saques"
questao_juridica: Como a prova-chave (descontos prolongados e saques) sustenta os resultados materiais (prescrição rejeitada; conversão; dobro; compensação; moral de R$ 5 mil) efetivamente decididos?
ratio_decidendi: O colegiado valorou descontos prolongados e saques e, com base nesse conjunto individualizado, concluiu por prescrição rejeitada; conversão; dobro; compensação; moral de R$ 5 mil.
resumo_predator: "5ª Câmara Cível, sob relatoria de AGENOR FERREIRA DE LIMA FILHO, julgou apelação parcialmente provida. No plano material, decidiu: prescrição rejeitada; conversão; dobro; compensação; moral de R$ 5 mil. A prova determinante foi descontos prolongados e saques."
