titulo: "Validade da contratação consignada: biometria, IP, código, contrato e depósito não devolvido"
questao_juridica: Taxa no teto, distinção entre CET e juros e demora superior a três anos afastam abusividade e vício?
ratio_decidendi: O colegiado valorou biometria, IP, código, contrato e depósito não devolvido e, com base nesse conjunto individualizado, concluiu por contrato e juros mantidos; conversão, restituição e moral afastados.
resumo_predator: "Núcleo 4.0-T. III, sob relatoria de Gilberto Franceschini, julgou apelação desprovida. No plano material, decidiu: contrato e juros mantidos; conversão, restituição e moral afastados. A prova determinante foi biometria, IP, código, contrato e depósito não devolvido."
