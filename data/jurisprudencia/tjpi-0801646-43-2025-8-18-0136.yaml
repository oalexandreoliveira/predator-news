titulo: Pagamento mínimo sem amortização torna RMC abusiva
questao_juridica: O julgamento examinou a validade e os efeitos da contratação de cartão consignado no caso concreto, considerando as provas documentais, o dever de informação e os pedidos patrimoniais efetivamente formulados.
ratio_decidendi: A modalidade foi invalidada ou readequada porque a prova não demonstrou consentimento informado suficiente ou revelou desvantagem exagerada, com definição individual dos efeitos restitutórios e morais.
resumo_predator: 2ª Turma Recursal decidiu pagamento mínimo sem amortização torna rmc abusiva, com recurso desprovido e efeitos materiais preservados separadamente no registro.
