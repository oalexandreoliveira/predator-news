titulo: Biometria facial confirma RCC e afasta conversão
questao_juridica: A contratação eletrônica com biometria facial comprova autoria e consentimento informado para preservar o RCC e rejeitar conversão, repetição e dano moral?
ratio_decidendi: A biometria e o instrumento eletrônico individualizado demonstraram adesão válida à modalidade, afastando vício, abusividade, conversão e os efeitos restitutório e moral.
resumo_predator: 4ª TURMA CÍVEL examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso conhecido e não provido.
