titulo: "Conversão do cartão consignado: contrato RCC e ausência de uso consciente"
questao_juridica: Como a prova-chave (contrato RCC e ausência de uso consciente) sustenta os resultados materiais (conversão; moral; recurso bancário desprovido) efetivamente decididos?
ratio_decidendi: O colegiado valorou contrato RCC e ausência de uso consciente e, com base nesse conjunto individualizado, concluiu por conversão; moral.
resumo_predator: "1ª Turma Recursal de Garanhuns, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso bancário desprovido. No plano material, decidiu: conversão; moral. A prova determinante foi contrato RCC e ausência de uso consciente."
