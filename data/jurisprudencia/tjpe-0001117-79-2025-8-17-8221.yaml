titulo: "Validade da contratação consignada: biometria, depósito e documentação digital"
questao_juridica: Como a prova-chave (biometria, depósito e documentação digital) sustenta os resultados materiais (contrato mantido por maioria) efetivamente decididos?
ratio_decidendi: O colegiado valorou biometria, depósito e documentação digital e, com base nesse conjunto individualizado, concluiu por contrato mantido.
resumo_predator: "1ª Turma Recursal da Capital, sob relatoria de ABELARDO TADEU DA SILVA SANTOS, julgou recurso bancário provido por maioria. No plano material, decidiu: contrato mantido. A prova determinante foi biometria, depósito e documentação digital."
