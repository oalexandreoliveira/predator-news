titulo: Contratação de cartão consignado invalidada
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a sistemática de desconto mínimo e encargos torna a
  dívida excessivamente onerosa ou de duração indefinida; se os descontos
  indevidos devem ser restituídos e, em caso positivo, de forma simples ou em
  dobro; se saques, compras ou faturas reiteradas demonstram ciência e aceitação
  da modalidade contratada, no contexto de recurso parcialmente provido.
ratio_decidendi: O uso do cartão em saques ou compras foi avaliado em conjunto
  com o dever de informação e a documentação contratual, levando o colegiado a
  invalidar a contratação ou a modalidade impugnada.
resumo_predator: A 4ª Câmara de Direito Privado examinou a contratação de cartão
  de crédito consignado e invalidou a contratação ou a modalidade impugnada,
  considerando determinante o uso do cartão em saques ou compras. No plano
  processual, houve recurso parcialmente provido.
