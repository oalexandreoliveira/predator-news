titulo: "Contratação de cartão consignado invalidada"
questao_juridica: "Validade e efeitos da contratação de cartão de crédito consignado diante da alegação de vício de consentimento, falha informativa ou abusividade."
ratio_decidendi: "O uso do cartão em saques ou compras foi avaliado em conjunto com o dever de informação e a documentação contratual, levando o colegiado a invalidar a contratação ou a modalidade impugnada."
resumo_predator: "A 4ª Câmara de Direito Privado examinou a contratação de cartão de crédito consignado e invalidou a contratação ou a modalidade impugnada, considerando determinante o uso do cartão em saques ou compras. No plano processual, houve recurso parcialmente provido."
