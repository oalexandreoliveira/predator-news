titulo: Provas do caso confirmam a contratação consignada
resumo_predator: O acórdão reconheceu a regularidade da contratação. A conclusão
  decorreu de a documentação e a disponibilização do crédito e também definiu o
  pedido de conversão para empréstimo consignado, com exame da restituição dos
  descontos e da responsabilidade por dano moral.
