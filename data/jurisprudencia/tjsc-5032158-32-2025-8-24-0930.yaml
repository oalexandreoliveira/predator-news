titulo: Uso comprovado e informação suficiente reformam anulação
questao_juridica: A documentação clara e a utilização comprovada afastam vício de consentimento e autorizam reformar sentença que declarara inexistentes as contratações RMC e RCC?
ratio_decidendi: O dever de informação foi considerado atendido e o uso comprovado confirmou ciência e adesão, levando à reforma da sentença e à improcedência dos pedidos declaratórios, restitutórios e morais.
resumo_predator: 4ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso do banco conhecido e provido.
