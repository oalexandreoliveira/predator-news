  data_publicacao: 2024-11-06
titulo: Controvérsia sobre cartão consignado decidida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se os elementos da contratação eletrônica são suficientes
  para demonstrar autoria, integridade e consentimento; se a assinatura ou a
  perícia demonstram autoria e adesão válida ao negócio impugnado; se o crédito
  recebido ou o saque realizado comprova a contratação e qual modalidade
  econômica foi efetivamente pactuada.
ratio_decidendi: O conjunto de autenticação e documentos eletrônicos foi
  avaliado em conjunto com o dever de informação e a documentação contratual,
  levando o colegiado a definir os efeitos da contratação conforme a prova
  disponível.
resumo_predator: O TERCEIRA TURMA RECURSAL examinou a contratação de cartão de
  crédito consignado e definiu os efeitos da contratação conforme a prova
  disponível, considerando determinante o conjunto de autenticação e documentos
  eletrônicos. O resultado processual foi preservado conforme o documento
  recuperado.
