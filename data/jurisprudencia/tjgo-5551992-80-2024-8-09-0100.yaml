titulo: "Conversão do cartão consignado: desconto mínimo e ausência de amortização"
questao_juridica: como modular restituição em contrato abusivo que perpetua dívida?
ratio_decidendi: O colegiado valorou desconto mínimo e ausência de amortização e, com base nesse conjunto individualizado, concluiu por conversão; simples antes do marco e dobro depois; dano moral.
resumo_predator: "4ª Câmara, sob relatoria de MARIA CRISTINA COSTA MORGADO, julgou apelação parcialmente provida. No plano material, decidiu: conversão; simples antes do marco e dobro depois; dano moral. A prova determinante foi desconto mínimo e ausência de amortização."
