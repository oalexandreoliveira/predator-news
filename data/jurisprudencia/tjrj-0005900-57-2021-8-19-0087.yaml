ratio_decidendi: O colegiado valorou extratos sem compras ou saques e, com base nesse conjunto individualizado, concluiu por conversão; dobro; compensação eventual; dano moral.
resumo_predator: "18ª Câmara, sob relatoria de Des(a). JDS. GUILHERME PEDROSA LOPES, julgou apelação parcialmente provida. No plano material, decidiu: conversão; dobro; compensação eventual; dano moral. A prova determinante foi extratos sem compras ou saques."
