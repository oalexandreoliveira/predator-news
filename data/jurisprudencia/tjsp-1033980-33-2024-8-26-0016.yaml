titulo: "Validade da contratação consignada: selfie, geolocalização, TED, compras e faturas"
questao_juridica: Dossiê eletrônico completo e uso reiterado dispensam perícia e afastam fraude e “dívida eterna”?
ratio_decidendi: O colegiado valorou selfie, geolocalização, TED, compras e faturas e, com base nesse conjunto individualizado, concluiu por contrato mantido; fraude, perícia, conversão e moral afastados.
resumo_predator: "6ª Turma Recursal Cível, sob relatoria de Vera Lúcia Calviño de Campos, julgou recurso inominado desprovido. No plano material, decidiu: contrato mantido; fraude, perícia, conversão e moral afastados. A prova determinante foi selfie, geolocalização, TED, compras e faturas."
