titulo: "Validade da contratação consignada: biometria, documentos e instrumento"
questao_juridica: Divergência semântica entre RCC e RMC produz vício quando o conteúdo contratual é inequívoco?
ratio_decidendi: O colegiado valorou biometria, documentos e instrumento e, com base nesse conjunto individualizado, concluiu por contrato mantido; inexistência, dobro e moral afastados.
resumo_predator: "13ª Câmara, sob relatoria de Ana de Lourdes Coutinho Silva da Fonseca, julgou apelação desprovida. No plano material, decidiu: contrato mantido; inexistência, dobro e moral afastados. A prova determinante foi biometria, documentos e instrumento."
