ratio_decidendi: O colegiado valorou contrato assinado e depósito; sem compras e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, dobro e dano afastados.
resumo_predator: "8ª Câmara, sob relatoria de Des(a). ANTONIO DA ROCHA LOURENCO NETO, julgou apelação desprovida. No plano material, decidiu: contrato mantido; conversão, dobro e dano afastados. A prova determinante foi contrato assinado e depósito; sem compras."
