titulo: "Validade da contratação consignada: biometria, informação, saques e compras"
questao_juridica: uso para compras distingue RMC abusiva do contrato conscientemente utilizado?
ratio_decidendi: O colegiado valorou biometria, informação, saques e compras e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, repetição e dano afastados.
resumo_predator: "5ª Câmara, sob relatoria de FERNANDO DE MELLO XAVIER, julgou recurso do banco provido; do consumidor desprovido. No plano material, decidiu: contrato mantido; conversão, repetição e dano afastados. A prova determinante foi biometria, informação, saques e compras."
