titulo: "Validade da contratação consignada: biometria, selfie, geolocalização, IP, autorização de saque e TED"
questao_juridica: cadeia digital mais crédito comprovam RCC mesmo sem prova de entrega do cartão?
ratio_decidendi: O colegiado valorou biometria, selfie, geolocalização, IP, autorização de saque e TED e, com base nesse conjunto individualizado, concluiu por RCC mantido; fraude, repetição e dano afastados.
resumo_predator: "10ª Câmara, sob relatoria de EDUARDO ABDON MOURA, julgou apelação desprovida. No plano material, decidiu: RCC mantido; fraude, repetição e dano afastados. A prova determinante foi biometria, selfie, geolocalização, IP, autorização de saque e TED."
