titulo: Validade formal e integração contratual por abusividade
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a sistemática de desconto mínimo e encargos torna a
  dívida excessivamente onerosa ou de duração indefinida; se o crédito recebido
  ou o saque realizado comprova a contratação e qual modalidade econômica foi
  efetivamente pactuada; se é possível preservar o contrato e integrar ou
  revisar suas cláusulas para afastar desvantagem exagerada, no contexto de
  recurso provido.
ratio_decidendi: A destinação econômica do saque foi avaliado em conjunto com o
  dever de informação e a documentação contratual, levando o colegiado a
  integrou o contrato sem negar sua validade formal.
resumo_predator: O SEGUNDA TURMA RECURSAL examinou a contratação de cartão de
  crédito consignado e integrou o contrato sem negar sua validade formal,
  considerando determinante a destinação econômica do saque. No plano
  processual, houve recurso provido.
