titulo: "Validade da contratação consignada: assinatura e termo; margem averbada sem desconto"
questao_juridica: mera averbação sem utilização ou prejuízo configura ilícito ou dano moral?
ratio_decidendi: O colegiado valorou assinatura e termo; margem averbada sem desconto e, com base nesse conjunto individualizado, concluiu por RCC mantido; ilícito e dano afastados.
resumo_predator: "5ª Câmara, sob relatoria de ALGOMIRO CARVALHO NETO, julgou apelação desprovida. No plano material, decidiu: RCC mantido; ilícito e dano afastados. A prova determinante foi assinatura e termo; margem averbada sem desconto."
