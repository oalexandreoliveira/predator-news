titulo: "Validade da contratação consignada: contrato, biometria, geolocalização, compras e saques"
questao_juridica: compras e saques afastam vício e a Súmula 63?
ratio_decidendi: O colegiado valorou contrato, biometria, geolocalização, compras e saques e, com base nesse conjunto individualizado, concluiu por RMC mantida; nulidade, repetição e dano afastados.
resumo_predator: "2ª Câmara, sob relatoria de SIRLEI MARTINS DA COSTA, julgou apelação desprovida. No plano material, decidiu: RMC mantida; nulidade, repetição e dano afastados. A prova determinante foi contrato, biometria, geolocalização, compras e saques."
