titulo: Biometria e transferência comprovam contratação digital
questao_juridica: O julgamento examinou a validade e os efeitos da contratação de cartão consignado no caso concreto, considerando as provas documentais, o dever de informação e os pedidos patrimoniais efetivamente formulados.
ratio_decidendi: A contratação foi mantida porque o conjunto documental e o comportamento posterior demonstraram autoria, ciência e recebimento ou uso do crédito, afastando vício e cobrança indevida.
resumo_predator: 1ª Turma Recursal decidiu biometria e transferência comprovam contratação digital, com recurso desprovido e efeitos materiais preservados separadamente no registro.
