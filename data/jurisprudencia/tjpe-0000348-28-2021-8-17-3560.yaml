titulo: "Validade da contratação consignada: autorização expressa no instrumento"
questao_juridica: Como a prova-chave (autorização expressa no instrumento) sustenta os resultados materiais (descontos mantidos por maioria) efetivamente decididos?
ratio_decidendi: O colegiado valorou autorização expressa no instrumento e, com base nesse conjunto individualizado, concluiu por descontos mantidos.
resumo_predator: "5ª Câmara Cível, sob relatoria de FABIO EUGENIO DANTAS DE OLIVEIRA LIMA, julgou apelação desprovida por maioria. No plano material, decidiu: descontos mantidos. A prova determinante foi autorização expressa no instrumento."
