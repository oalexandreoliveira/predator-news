titulo: "Validade da contratação consignada: assinatura, selfie, geolocalização e termos"
questao_juridica: O cancelamento do cartão extingue a dívida ou apenas cessa o produto, mantendo saldo e descontos?
ratio_decidendi: O colegiado valorou assinatura, selfie, geolocalização e termos e, com base nesse conjunto individualizado, concluiu por cancelamento mantido; dívida subsistente; dobro, conversão e moral afastados.
resumo_predator: "20ª Câmara, sob relatoria de Lidia Regina Rodrigues Monteiro Cabrini, julgou apelação desprovida. No plano material, decidiu: cancelamento mantido; dívida subsistente; dobro, conversão e moral afastados. A prova determinante foi assinatura, selfie, geolocalização e termos."
