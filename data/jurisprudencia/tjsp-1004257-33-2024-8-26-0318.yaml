titulo: "Validade da contratação consignada: selfie, documentos, IP, geolocalização e transferência"
questao_juridica: Trilha técnica convergente e crédito não contestado satisfazem o ônus do banco?
ratio_decidendi: O colegiado valorou selfie, documentos, IP, geolocalização e transferência e, com base nesse conjunto individualizado, concluiu por contrato mantido; fraude, restituição e moral afastados.
resumo_predator: "Núcleo 4.0-T. IV, sob relatoria de Léa Duarte, julgou apelação desprovida. No plano material, decidiu: contrato mantido; fraude, restituição e moral afastados. A prova determinante foi selfie, documentos, IP, geolocalização e transferência."
