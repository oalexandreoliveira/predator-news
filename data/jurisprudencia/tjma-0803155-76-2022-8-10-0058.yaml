titulo: RMC convertida em empréstimo consignado
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a operação deve ser preservada como cartão consignado ou
  convertida em empréstimo consignado comum; se os descontos indevidos devem ser
  restituídos e, em caso positivo, de forma simples ou em dobro; se os descontos
  e as circunstâncias da contratação configuram dano moral indenizável, no
  contexto de recurso parcialmente provido.
ratio_decidendi: O conjunto documental descrito na decisão foi avaliado em
  conjunto com o dever de informação e a documentação contratual, levando o
  colegiado a determinar a conversão da operação.
resumo_predator: O Quarta Câmara de Direito Privado examinou a contratação de
  cartão de crédito consignado e determinou a conversão da operação,
  considerando determinante o conjunto documental descrito na decisão. No plano
  processual, houve recurso parcialmente provido.
