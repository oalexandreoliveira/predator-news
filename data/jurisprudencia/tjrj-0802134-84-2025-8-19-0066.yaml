resumo_predator: "9ª Câmara, sob relatoria de Des(a). FERNANDA FERNANDES COELHO ARRABIDA PAES, julgou apelação provida. No plano material, decidiu: contrato mantido; conversão, dobro e dano afastados. A prova determinante foi biometria, geolocalização, IP, metadados e crédito."
