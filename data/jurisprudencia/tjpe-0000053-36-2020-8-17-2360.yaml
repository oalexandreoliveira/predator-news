titulo: "Conversão do cartão consignado: transferências comprovadas, sem informação sobre amortização"
questao_juridica: Como a prova-chave (transferências comprovadas, sem informação sobre amortização) sustenta os resultados materiais (prescrição rejeitada; conversão; moral afastado) efetivamente decididos?
ratio_decidendi: O colegiado valorou transferências comprovadas, sem informação sobre amortização e, com base nesse conjunto individualizado, concluiu por prescrição rejeitada; conversão; moral afastado.
resumo_predator: "1ª Câmara Regional de Caruaru, sob relatoria de LUCIANO DE CASTRO CAMPOS, julgou embargos julgados sem alteração substancial. No plano material, decidiu: prescrição rejeitada; conversão; moral afastado. A prova determinante foi transferências comprovadas, sem informação sobre amortização."
