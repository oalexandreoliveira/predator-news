titulo: Controvérsia sobre cartão consignado decidida
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a sistemática de desconto mínimo e encargos torna a
  dívida excessivamente onerosa ou de duração indefinida; se os descontos e as
  circunstâncias da contratação configuram dano moral indenizável; se saques,
  compras ou faturas reiteradas demonstram ciência e aceitação da modalidade
  contratada, no contexto de recurso desprovido.
ratio_decidendi: O uso do cartão em saques ou compras foi avaliado em conjunto
  com o dever de informação e a documentação contratual, levando o colegiado a
  definir os efeitos da contratação conforme a prova disponível.
resumo_predator: A 3ª TURMA CÍVEL examinou a contratação de cartão de crédito
  consignado e definiu os efeitos da contratação conforme a prova disponível,
  considerando determinante o uso do cartão em saques ou compras. No plano
  processual, houve recurso desprovido.
