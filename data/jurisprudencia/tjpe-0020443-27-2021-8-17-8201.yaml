titulo: "Validade da contratação consignada: entrega, compras regulares, saques e faturas"
questao_juridica: Como a prova-chave (entrega, compras regulares, saques e faturas) sustenta os resultados materiais (contrato mantido) efetivamente decididos?
ratio_decidendi: O colegiado valorou entrega, compras regulares, saques e faturas e, com base nesse conjunto individualizado, concluiu por contrato mantido.
resumo_predator: "1ª Turma Recursal da Capital, sob relatoria de ABELARDO TADEU DA SILVA SANTOS, julgou recurso desprovido. No plano material, decidiu: contrato mantido. A prova determinante foi entrega, compras regulares, saques e faturas."
