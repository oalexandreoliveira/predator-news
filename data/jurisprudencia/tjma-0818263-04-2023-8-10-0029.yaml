titulo: Contrato digital diverso não comprova adesão ao cartão consignado
resumo_predator: O colegiado afastou a prova de adesão porque o contrato digital
  exibido era diverso do objeto discutido e não observava as formalidades
  aplicáveis, mas excluiu o dano moral.
