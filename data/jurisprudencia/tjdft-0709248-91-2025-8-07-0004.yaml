resumo_predator: APELAÇÃO. CIVIL. PROCESSO CIVIL. DIREITO DO CONSUMIDOR. AÇÃO
  DECLARATÓRIA DE NULIDADE DE NEGÓCIO JURÍDICO C/C REPETIÇÃO DE INDÉBITO E
  INDENIZAÇÃO POR DANOS MORAIS. CARTÃO DE CRÉDITO CONSIGNADO. RESERVA DE MARGEM
  CONSIGNÁVEL. ALEGADO VÍCIO DE CONSENTIMENTO. DEVER DE INFORMAÇÃO. REVELIA.
  PRESUNÇÃO RELATIVA. AUSÊNCIA DE PROVA DE ILICITUDE. DANOS MORAIS. REPETIÇÃO DE
  INDÉBITO. CONVERSÃO CONTRATUAL. IMPOSSIBILIDADE. SENTENÇA DE IMPROCEDÊNCIA
  MANTIDA. I. CASO EM EXAME 1. Apelação cível interposta pelo autor contra
  sentença que julgou improcedentes os pedidos formulados na inicial de ação
  declaratória de nulidade de contrato de cartão de crédito consignado com
  reserva de margem consignável, cumulada com repetição de indébito e
  indenização por danos morais. 2. A sentença reconheceu a validade da
  contratação, afastou os efeitos automáticos da revelia e rejeitou os pedidos
  indenizatórios e revisio
