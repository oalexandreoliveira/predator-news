titulo: Validade formal e integração contratual por abusividade
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a sistemática de desconto mínimo e encargos torna a
  dívida excessivamente onerosa ou de duração indefinida; se a operação deve ser
  preservada como cartão consignado ou convertida em empréstimo consignado
  comum; se os descontos indevidos devem ser restituídos e, em caso positivo, de
  forma simples ou em dobro; se os descontos e as circunstâncias da contratação
  configuram dano moral indenizável; se é possível preservar o contrato e
  integrar ou revisar suas cláusulas para afastar desvantagem exagerada, no
  contexto de recurso provido.
ratio_decidendi: O conjunto documental descrito na decisão foi avaliado em
  conjunto com o dever de informação e a documentação contratual, levando o
  colegiado a integrou o contrato sem negar sua validade formal.
resumo_predator: A 2ª TURMA CÍVEL examinou a contratação de cartão de crédito
  consignado e integrou o contrato sem negar sua validade formal, considerando
  determinante o conjunto documental descrito na decisão. No plano processual,
  houve recurso provido.
