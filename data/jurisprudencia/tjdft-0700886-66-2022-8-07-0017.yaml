resumo_predator: DIREITO DO CONSUMIDOR. DIREITO CIVIL. APELAÇÃO CÍVEL. CARTÃO DE
  CRÉDITO CONSIGNADO COM RESERVA DE MARGEM CONSIGNÁVEL (RMC). APOSENTADA.
  HIPERVULNERABILIDADE DO CONSUMIDOR. FALHA NO DEVER DE INFORMAÇÃO. AUSÊNCIA DE
  CLAREZA QUANTO À NATUREZA DO CONTRATO E À DINÂMICA DE AMORTIZAÇÃO DA DÍVIDA.
  PRÁTICA ABUSIVA. NULIDADE CONTRATUAL. RETORNO AO STATUS QUO ANTE. COMPENSAÇÃO
  DE VALORES. DANOS MORAIS IN RE IPSA. RECURSO DO RÉU DESPROVIDO. RECURSO DA
  AUTORA PROVIDO. I. CASO EM EXAME 1. Apelação cível interposta por BANCO BMG
  S.A. e apelação adesiva interposta por consumidora contra sentença que, em
  ação declaratória de inexistência de débito cumulada com indenização por danos
  materiais e morais, reconheceu a abusividade decorrente da omissão de
  informações quanto à quantidade de parcelas e à dinâmica de pagamento do
  cartão de crédito consignado com RMC, limitou a cobrança a 84 parcelas e
  determinou
