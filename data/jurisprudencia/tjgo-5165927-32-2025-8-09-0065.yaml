titulo: "Validade da contratação consignada: selfie, depósito e múltiplos saques"
questao_juridica: múltiplos saques demonstram ciência e qual prazo incide em descontos sucessivos?
ratio_decidendi: O colegiado valorou selfie, depósito e múltiplos saques e, com base nesse conjunto individualizado, concluiu por prescrição afastada; contrato mantido; repetição e dano afastados.
resumo_predator: "6ª Câmara, sob relatoria de ROBERTA NASSER LEONE, julgou apelação desprovida. No plano material, decidiu: prescrição afastada; contrato mantido; repetição e dano afastados. A prova determinante foi selfie, depósito e múltiplos saques."
