titulo: Informação qualificada protege consumidor idoso e analfabeto
questao_juridica: A condição de consumidor idoso e analfabeto exige informação qualificada capaz de demonstrar compreensão da RMC, além da mera formalização do instrumento?
ratio_decidendi: A vulnerabilidade agravada exigia demonstração material de compreensão da modalidade; ausente prova suficiente, reconheceu-se erro substancial, conversão e repetição temporalmente modulada, sem dano moral.
resumo_predator: 6ª Câmara de Direito Privado examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso conhecido e parcialmente provido.
