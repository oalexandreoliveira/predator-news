titulo: "Validade da contratação consignada: biometria, geolocalização, IP, selfie, TED e compras"
questao_juridica: cadeia digital e compras afastam a Súmula 63?
ratio_decidendi: O colegiado valorou biometria, geolocalização, IP, selfie, TED e compras e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, repetição e dano afastados.
resumo_predator: "8ª Câmara, sob relatoria de JOSÉ RICARDO M. MACHADO, julgou recurso do banco provido; do consumidor desprovido. No plano material, decidiu: contrato mantido; conversão, repetição e dano afastados. A prova determinante foi biometria, geolocalização, IP, selfie, TED e compras."
