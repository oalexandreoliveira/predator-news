titulo: "Conversão do cartão consignado: impressão digital, assinatura a rogo e saque único"
questao_juridica: Como a prova-chave (impressão digital, assinatura a rogo e saque único) sustenta os resultados materiais (conversão; dobro; moral) efetivamente decididos?
ratio_decidendi: O colegiado valorou impressão digital, assinatura a rogo e saque único e, com base nesse conjunto individualizado, concluiu por conversão; dobro; moral.
resumo_predator: "1ª Turma Justiça Eficiente, 3º Gab., sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso provido. No plano material, decidiu: conversão; dobro; moral. A prova determinante foi impressão digital, assinatura a rogo e saque único."
