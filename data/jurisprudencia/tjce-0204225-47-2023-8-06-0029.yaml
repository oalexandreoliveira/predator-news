titulo: Selfie, geolocalização e crédito confirmam contratação
questao_juridica: Biometria facial, selfie, geolocalização e recebimento dos valores formam conjunto suficiente para comprovar contratação digital e regularidade dos descontos?
ratio_decidendi: Os rastros digitais convergentes e o recebimento do crédito comprovaram autoria e execução do negócio; a alegação tardia de vício não afastou a validade nem gerou dano moral.
resumo_predator: 2ª Turma do Núcleo de Justiça 4.0 - Direito Privado examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso parcialmente conhecido e desprovido.
