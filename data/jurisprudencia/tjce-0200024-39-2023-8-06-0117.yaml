titulo: Prescrição parcial e restituição mista acompanham conversão
questao_juridica: A falha informativa autoriza converter a RMC e como prescrição parcial, marco temporal da repetição e dano moral compõem os efeitos do julgamento?
ratio_decidendi: A insuficiência informacional justificou a conversão; os descontos foram submetidos à prescrição quinquenal parcial e a restituição variou conforme o marco temporal aplicável, com dano moral reconhecido e quantificado no caso.
resumo_predator: 1ª Turma do Núcleo de Justiça 4.0 - Direito Privado examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso parcialmente provido.
