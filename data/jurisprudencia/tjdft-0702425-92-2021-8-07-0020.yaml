titulo: Contratação de cartão consignado invalidada
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a assinatura ou a perícia demonstram autoria e adesão
  válida ao negócio impugnado; se a sistemática de desconto mínimo e encargos
  torna a dívida excessivamente onerosa ou de duração indefinida; se a operação
  deve ser preservada como cartão consignado ou convertida em empréstimo
  consignado comum; se o crédito recebido ou o saque realizado comprova a
  contratação e qual modalidade econômica foi efetivamente pactuada, no contexto
  de recurso provido.
ratio_decidendi: A clareza do instrumento e do consentimento documentado foi
  avaliado em conjunto com o dever de informação e a documentação contratual,
  levando o colegiado a invalidar a contratação ou a modalidade impugnada.
resumo_predator: O TERCEIRA TURMA RECURSAL examinou a contratação de cartão de
  crédito consignado e invalidou a contratação ou a modalidade impugnada,
  considerando determinante a clareza do instrumento e do consentimento
  documentado. No plano processual, houve recurso provido.
