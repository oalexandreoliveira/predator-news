questao_juridica: biometria isolada supre informação qualificada?
ratio_decidendi: O colegiado valorou biometria; informação insuficiente e, com base nesse conjunto individualizado, concluiu por nulidade; dobro; dano moral de R$ 20 mil.
resumo_predator: "17ª Câmara, sob relatoria de Mauro Pena Rocha (JD), julgou apelação provida. No plano material, decidiu: nulidade; dobro; dano moral de R$ 20 mil. A prova determinante foi biometria; informação insuficiente."
