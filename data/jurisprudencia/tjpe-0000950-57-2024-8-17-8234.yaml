titulo: "Validade da contratação consignada: biometria, saque/crédito e conduta processual individual"
questao_juridica: Como a prova-chave (biometria, saque/crédito e conduta processual individual) sustenta os resultados materiais (contrato mantido; multa por má-fé mantida) efetivamente decididos?
ratio_decidendi: O colegiado valorou biometria, saque/crédito e conduta processual individual e, com base nesse conjunto individualizado, concluiu por contrato e multa por má-fé mantidos.
resumo_predator: "1ª Turma Justiça Eficiente, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso desprovido. No plano material, decidiu: contrato e multa por má-fé mantidos. A prova determinante foi biometria, saque/crédito e conduta processual individual."
