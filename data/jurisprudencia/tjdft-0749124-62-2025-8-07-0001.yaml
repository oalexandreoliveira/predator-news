resumo_predator: O acórdão reconheceu a regularidade da contratação. A conclusão
  decorreu de os registros eletrônicos e a biometria e também definiu o pedido
  de conversão para empréstimo consignado, com exame da restituição dos
  descontos e da responsabilidade por dano moral.
