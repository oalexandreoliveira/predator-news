questao_juridica: O colegiado examinou se as informações contratuais foram
  claras e suficientes, se os registros digitais comprovavam autoria e
  consentimento.
ratio_decidendi: O TJDFT reconheceu a regularidade da contratação porque
  considerou determinantes os registros eletrônicos e a biometria, avaliados em
  conjunto com o dever de informação e a transparência da modalidade.
