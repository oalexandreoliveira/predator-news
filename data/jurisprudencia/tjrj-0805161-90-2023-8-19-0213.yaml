titulo: "Validade da contratação consignada: contato telefônico, autenticação mecânica, selfie e uso"
questao_juridica: aceitação eletrônica combinada com contato telefônico é válida?
ratio_decidendi: O colegiado valorou contato telefônico, autenticação mecânica, selfie e uso e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, dobro e dano afastados.
resumo_predator: "16ª Câmara, sob relatoria de Des(a). DES. REGINA HELENA FABREGAS FERREIRA, julgou apelação desprovida. No plano material, decidiu: contrato mantido; conversão, dobro e dano afastados. A prova determinante foi contato telefônico, autenticação mecânica, selfie e uso."
