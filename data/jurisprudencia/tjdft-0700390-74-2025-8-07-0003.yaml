resumo_predator: "PROCESSUAL CIVIL. CONSUMIDOR. APELAÇÃO CÍVEL. APLICAÇÃO DO CDC
  AOS CONTRATOS BANCÁRIOS. NULIDADE DE CONTRATO. EMPRÉSTIMO CONSIGNADO VIA
  CARTÃO DE CRÉDITO (RMC). VÍCIO DO CONSENTIMENTO NÃO COMPROVADO. CLÁUSULAS
  CONTRATUAIS OSTENSIVA E CLARAS. RECURSO CONHECIDO E DESPROVIDO. I. CASO EM
  EXAME 1. Apelação cível interposta por consumidor beneficiário do INSS contra
  sentença que julgou improcedentes os pedidos de declaração de inexistência de
  débito, cessação de descontos, conversão de contrato de cartão de crédito
  consignado com reserva de margem consignável (RMC) em empréstimo consignado
  tradicional, repetição de indébito e indenização por danos morais, formulados
  em face de instituição financeira. Sustenta ter acreditado contratar
  empréstimo consignado comum, alegando falha no dever de informação e vício de
  consentimento. II. CASO EM EXAME 2. Há duas questões em discussão: (i) definir
  se ho"
