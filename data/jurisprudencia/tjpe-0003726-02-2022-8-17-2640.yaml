titulo: "Conversão do cartão consignado: crédito inicial sem compras e descontos sucessivos"
questao_juridica: Como a prova-chave (crédito inicial sem compras e descontos sucessivos) sustenta os resultados materiais (prescrição rejeitada; conversão; dobro modulado; moral afastado) efetivamente decididos?
ratio_decidendi: O colegiado valorou crédito inicial sem compras e descontos sucessivos e, com base nesse conjunto individualizado, concluiu por prescrição rejeitada; conversão; dobro modulado; moral afastado.
resumo_predator: "1ª Câmara Regional de Caruaru, sob relatoria de DAMIAO SEVERIANO DE SOUSA, julgou apelação parcialmente provida. No plano material, decidiu: prescrição rejeitada; conversão; dobro modulado; moral afastado. A prova determinante foi crédito inicial sem compras e descontos sucessivos."
