titulo: Contratação de cartão consignado invalidada
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se a operação deve ser preservada como cartão consignado ou
  convertida em empréstimo consignado comum; se os descontos indevidos devem ser
  restituídos e, em caso positivo, de forma simples ou em dobro, no contexto de
  recurso provido.
ratio_decidendi: O conjunto documental descrito na decisão foi avaliado em
  conjunto com o dever de informação e a documentação contratual, levando o
  colegiado a invalidar a contratação ou a modalidade impugnada.
resumo_predator: A 7ª TURMA CÍVEL examinou a contratação de cartão de crédito
  consignado e invalidou a contratação ou a modalidade impugnada, considerando
  determinante o conjunto documental descrito na decisão. No plano processual,
  houve recurso provido.
