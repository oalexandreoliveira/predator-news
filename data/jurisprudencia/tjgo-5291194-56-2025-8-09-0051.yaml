titulo: "Validade da contratação consignada: biometria, geolocalização, TCE e faturas de compras"
questao_juridica: amortização fixa do RCC afasta perpetuidade e Súmula 63?
ratio_decidendi: O colegiado valorou biometria, geolocalização, TCE e faturas de compras e, com base nesse conjunto individualizado, concluiu por RCC mantido; conversão, repetição e dano afastados.
resumo_predator: "7ª Câmara, sob relatoria de ANA CRISTINA RIBEIRO PETERNELLA FRANÇA, julgou agravo interno desprovido. No plano material, decidiu: RCC mantido; conversão, repetição e dano afastados. A prova determinante foi biometria, geolocalização, TCE e faturas de compras."
