titulo: "Validade da contratação consignada: biometria, geolocalização, fotografia e termo"
questao_juridica: Ausência de compras invalida RCC quando termo e autenticação são claros, e rolagem sem prazo é abusiva por si?
ratio_decidendi: O colegiado valorou biometria, geolocalização, fotografia e termo e, com base nesse conjunto individualizado, concluiu por contrato mantido; conversão, restituição e moral afastados.
resumo_predator: "Núcleo 4.0-T. II, sob relatoria de Marcio Bonetti, julgou apelação desprovida. No plano material, decidiu: contrato mantido; conversão, restituição e moral afastados. A prova determinante foi biometria, geolocalização, fotografia e termo."
