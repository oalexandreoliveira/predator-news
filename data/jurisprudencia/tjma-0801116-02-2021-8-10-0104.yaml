  data_publicacao: 2022-08-10
titulo: Validade formal e integração contratual por abusividade
questao_juridica: O julgamento examinou se a prova do caso demonstra
  consentimento livre e informado quanto à contratação de cartão consignado; se
  a instituição explicou de forma clara a natureza, o custo e a amortização do
  cartão consignado; se os elementos da contratação eletrônica são suficientes
  para demonstrar autoria, integridade e consentimento; se a assinatura ou a
  perícia demonstram autoria e adesão válida ao negócio impugnado; se a
  contratação observou as cautelas necessárias para demonstrar a manifestação de
  vontade da pessoa analfabeta; se a operação deve ser preservada como cartão
  consignado ou convertida em empréstimo consignado comum; se há elementos
  concretos e individualizados que autorizem reconhecer abuso processual ou
  litigância de má-fé; se o crédito recebido ou o saque realizado comprova a
  contratação e qual modalidade econômica foi efetivamente pactuada; se é
  possível preservar o contrato e integrar ou revisar suas cláusulas para
  afastar desvantagem exagerada, no contexto de recurso parcialmente provido.
ratio_decidendi: O conjunto de autenticação e documentos eletrônicos foi
  avaliado em conjunto com o dever de informação e a documentação contratual,
  levando o colegiado a integrou o contrato sem negar sua validade formal.
resumo_predator: O Turma Recursal Cível e Criminal de Presidente Dutra examinou
  a contratação de cartão de crédito consignado e integrou o contrato sem negar
  sua validade formal, considerando determinante o conjunto de autenticação e
  documentos eletrônicos. No plano processual, houve recurso parcialmente
  provido.
