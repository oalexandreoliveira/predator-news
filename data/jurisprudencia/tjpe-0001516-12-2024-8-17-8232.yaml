titulo: "Conversão do cartão consignado: biometria/vídeo sem informação qualificada; crédito recebido"
questao_juridica: Como a prova-chave (biometria/vídeo sem informação qualificada; crédito recebido) sustenta os resultados materiais (conversão; dobro; compensação; moral de R$ 5 mil) efetivamente decididos?
ratio_decidendi: O colegiado valorou biometria/vídeo sem informação qualificada; crédito recebido e, com base nesse conjunto individualizado, concluiu por conversão; dobro; compensação; moral.
resumo_predator: "1ª Turma Justiça Eficiente, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso bancário parcialmente provido. No plano material, decidiu: conversão; dobro; compensação; moral. A prova determinante foi biometria/vídeo sem informação qualificada; crédito recebido."
