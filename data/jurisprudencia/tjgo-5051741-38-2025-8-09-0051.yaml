titulo: "Validade da contratação consignada: assinatura eletrônica, TCE e saque"
questao_juridica: saque isolado, com TCE, demonstra ciência suficiente para distinguishing?
ratio_decidendi: O colegiado valorou assinatura eletrônica, TCE e saque e, com base nesse conjunto individualizado, concluiu por RMC mantida; nulidade, repetição e dano afastados.
resumo_predator: "4ª Câmara, sob relatoria de MARIA CRISTINA COSTA MORGADO, julgou apelação desprovida. No plano material, decidiu: RMC mantida; nulidade, repetição e dano afastados. A prova determinante foi assinatura eletrônica, TCE e saque."
