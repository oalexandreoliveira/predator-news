titulo: "Validade da contratação consignada: instrumento com RMC expressa"
questao_juridica: Como a prova-chave (instrumento com RMC expressa) sustenta os resultados materiais (contrato mantido; dobro rejeitado) efetivamente decididos?
ratio_decidendi: O colegiado valorou instrumento com RMC expressa e, com base nesse conjunto individualizado, concluiu por contrato mantido; dobro rejeitado.
resumo_predator: "1ª Turma Recursal de Petrolina, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso desprovido. No plano material, decidiu: contrato mantido; dobro rejeitado. A prova determinante foi instrumento com RMC expressa."
