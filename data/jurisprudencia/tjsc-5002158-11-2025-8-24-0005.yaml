titulo: Biometria, geolocalização e compras validam RMC
questao_juridica: Biometria facial, documentos, geolocalização e compras comprovadas demonstram contratação consciente e impedem a conversão da RMC em empréstimo consignado?
ratio_decidendi: O contrato claro, corroborado por biometria, documentação, geolocalização e compras, comprovou autoria, ciência e uso da modalidade, afastando abusividade e a conversão pretendida.
resumo_predator: 6ª Câmara de Direito Comercial manteve a contratação de cartão consignado após valorar de forma conjunta a documentação, os elementos digitais e o comportamento comprovado no caso, com recurso conhecido e desprovido.
