titulo: Regularidade de cartão consignado com RMC e RCC afasta vício de consentimento
resumo_predator: A 1ª Turma Cível manteve a improcedência e afastou vício de
  consentimento em contratos de cartão de crédito consignado nas modalidades RMC
  e RCC, diante de informação contratual clara, descontos compatíveis e crédito
  disponibilizado.
