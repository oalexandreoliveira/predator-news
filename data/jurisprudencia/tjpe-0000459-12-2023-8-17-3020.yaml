titulo: "Conversão do cartão consignado: ausência de compras, TED e descontos"
questao_juridica: Como a prova-chave (ausência de compras, TED e descontos) sustenta os resultados materiais (conversão; restituição temporalmente modulada; compensação; moral) efetivamente decididos?
ratio_decidendi: O colegiado valorou ausência de compras, TED e descontos e, com base nesse conjunto individualizado, concluiu por conversão; simples/dobro por período; compensação; moral.
resumo_predator: "5ª Câmara Cível, sob relatoria de FABIO EUGENIO DANTAS DE OLIVEIRA LIMA, julgou apelação parcialmente provida. No plano material, decidiu: conversão; simples/dobro por período; compensação; moral. A prova determinante foi ausência de compras, TED e descontos."
