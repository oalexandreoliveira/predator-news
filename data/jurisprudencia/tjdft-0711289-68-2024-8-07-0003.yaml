resumo_predator: APELAÇÃO CÍVEL. CONSUMIDOR E PROCESSO CIVIL. AÇÃO SOB O
  PROCEDIMENTO COMUM. DECLARAÇÃO DE INEXISTÊNCIA DE CONTRATO DE CARTÃO DE
  CRÉDITO CONSIGNADO. AUSÊNCIA DE RECURSO QUANTO AO TEMA. REPETIÇÃO DOBRADA DE
  VALORES. DESCABIMENTO. ATUALIZAÇÃO DOS VALORES A SEREM RESTITUÍDOS. SELIC.
  SENTENÇA PARCIALMENTE REFORMADA. 1. No caso concreto, em que pese a sentença
  recorrida tenha declarado a inexistência do cartão de crédito consignado e
  condenado o banco réu, ora apelante, a restituir os valores descontados na
  forma dobrada, a título de reserva de margem consignável (RMC), a matéria
  recursal controvertida limita-se a verificar se é ou não devida a repetição em
  dobro (art. 42, parágrafo único, do Código de Defesa do Consumidor) na
  situação examinada. Até por esse motivo, por presente distinguishing na
