questao_juridica: formalidade documental demonstra compreensão do produto?
ratio_decidendi: O colegiado valorou assinatura e TCE sem ciência material e, com base nesse conjunto individualizado, concluiu por nulidade e inexistência mantidas; dobro; dano moral.
resumo_predator: "21ª Câmara, sob relatoria de Luziene Barbosa Lima, julgou recursos desprovidos. No plano material, decidiu: nulidade e inexistência mantidas; dobro; dano moral. A prova determinante foi assinatura e TCE sem ciência material."
