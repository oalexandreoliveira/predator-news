titulo: "Validade da contratação consignada: selfie, IP, hash e saque único, sem compras"
questao_juridica: Saque único sem compras comprova conhecimento quando a cadeia técnica é robusta?
ratio_decidendi: O colegiado valorou selfie, IP, hash e saque único, sem compras e, com base nesse conjunto individualizado, concluiu por contrato mantido; fraude, restituição e moral afastados.
resumo_predator: "18ª Câmara, sob relatoria de Wilson Julio Zanluqui, julgou apelação desprovida. No plano material, decidiu: contrato mantido; fraude, restituição e moral afastados. A prova determinante foi selfie, IP, hash e saque único, sem compras."
