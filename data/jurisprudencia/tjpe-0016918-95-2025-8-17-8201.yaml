titulo: "Validade da contratação consignada: assinatura a rogo, biometria, TED, selfie e reconhecimento em audiência"
questao_juridica: Como a prova-chave (assinatura a rogo, biometria, TED, selfie e reconhecimento em audiência) sustenta os resultados materiais (contrato de analfabeta mantido) efetivamente decididos?
ratio_decidendi: O colegiado valorou assinatura a rogo, biometria, TED, selfie e reconhecimento em audiência e, com base nesse conjunto individualizado, concluiu por contrato mantido.
resumo_predator: "1ª Turma Justiça Eficiente, sob relatoria de ANA CAROLINA FERNANDES PAIVA, julgou recurso da consumidora desprovido. No plano material, decidiu: contrato mantido. A prova determinante foi assinatura a rogo, biometria, TED, selfie e reconhecimento em audiência."
