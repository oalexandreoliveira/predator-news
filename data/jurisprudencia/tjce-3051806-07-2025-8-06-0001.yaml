titulo: Biometria e geolocalização afastam fraude e restituição
questao_juridica: Contrato digital, biometria facial e geolocalização individualizadas satisfazem o ônus de provar a contratação e afastam fraude, repetição e dano moral?
ratio_decidendi: A documentação eletrônica robusta individualizou a operação e satisfez o ônus probatório da instituição, preservando o contrato e afastando ilicitude, repetição e reparação moral.
resumo_predator: 6ª Câmara de Direito Privado examinou de forma individualizada prova, informação e efeitos patrimoniais no cartão consignado, com recurso conhecido e desprovido.
