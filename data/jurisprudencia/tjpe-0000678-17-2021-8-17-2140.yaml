titulo: "Invalidade da contratação consignada: formalidade irregular para analfabeto e ausência de uso"
questao_juridica: Como a prova-chave (formalidade irregular para analfabeto e ausência de uso) sustenta os resultados materiais (invalidade; dobro; moral de R$ 5 mil) efetivamente decididos?
ratio_decidendi: O colegiado valorou formalidade irregular para analfabeto e ausência de uso e, com base nesse conjunto individualizado, concluiu por invalidade; dobro; moral de R$ 5 mil.
resumo_predator: "2ª Câmara Cível, sob relatoria de ANDRE VICENTE PIRES ROSA, julgou apelação provida. No plano material, decidiu: invalidade; dobro; moral de R$ 5 mil. A prova determinante foi formalidade irregular para analfabeto e ausência de uso."
