titulo: "Validade da contratação consignada: selfies, documentos, geolocalização, créditos e faturas"
questao_juridica: Trilha separada e uso de dois contratos afastam alegação unitária de fraude?
ratio_decidendi: O colegiado valorou selfies, documentos, geolocalização, créditos e faturas e, com base nesse conjunto individualizado, concluiu por dois contratos mantidos; fraude, restituição e moral afastados.
resumo_predator: "20ª Câmara, sob relatoria de Maria Salete Corrêa Dias, julgou apelação desprovida. No plano material, decidiu: dois contratos mantidos; fraude, restituição e moral afastados. A prova determinante foi selfies, documentos, geolocalização, créditos e faturas."
